name: CI

# Continuous Integration:
#   - Executes all unit and integration test suites via scripts/run_tests.sh
#   - Verifies CycloneDX SBOM integrity
#   - Verifies AWS CDK CloudFormation stack synthesis across all 5 stacks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r agent/cost_lambda/requirements.txt || true
          pip install -r agent/cdc/requirements.txt || true

      - name: Run test suites
        run: ./scripts/run_tests.sh

  cdk-synth:
    name: CDK Synthesis Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agent/infra/cdk/package-lock.json

      - name: Install CDK dependencies
        run: |
          cd agent/infra/cdk
          npm ci
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: CDK Synth
        env:
          AWS_DEFAULT_REGION: us-east-2
          AWS_ACCESS_KEY_ID: dummy-access-key
          AWS_SECRET_ACCESS_KEY: dummy-secret-key
        run: |
          cd agent/infra/cdk
          . .venv/bin/activate
          npx cdk synth --quiet
